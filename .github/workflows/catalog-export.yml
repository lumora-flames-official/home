name: Export Catalogue PDF

# Triggers:
#   1. Any push to main that touches product data or images — auto-update.
#   2. workflow_dispatch — run manually from the Actions tab at any time.
#
# The commit back uses [skip ci] so the deploy workflow is not re-triggered.

on:
  push:
    branches: [main]
    paths:
      - 'src/data/catalog.json'
      - 'src/data/catalog-images/**'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate catalogue PDF
        run: npx tsx scripts/generateCatalog.tsx

      # Downloadable from the Actions tab for 90 days — no site visit needed.
      - name: Upload catalogue artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumora-flames-catalogue
          path: public/catalog.pdf
          retention-days: 90

      - name: Commit catalogue to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog.pdf
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update catalogue PDF [skip ci]"
          git push
