<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The `?v=` is a cache-buster, not decoration. Both filenames previously served
      the Vite template's purple bolt, and browsers cache favicons by URL far more
      stubbornly than page assets - a hard refresh does not evict them. Bump the
      number whenever the artwork changes, or returning visitors keep the old icon.
    -->
    <link rel="icon" type="image/svg+xml" href="/home/favicon.svg?v=2" />
    <!-- iOS ignores SVG favicons and screenshots the page instead; this is the home-screen icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/home/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lumora Flames — Handcrafted Artisanal Candles</title>
    <meta
      name="description"
      content="Small-batch candles poured by hand: festive urlis and diyas, bespoke fragrance blends, food-mimicking wax sculptures, and raw materials for candle makers."
    />

    <!--
      Open Graph, and this is not decoration.

      The site's entire conversion path is someone pasting a link into WhatsApp, and
      WhatsApp builds its preview card from these tags. Without them a shared link
      renders as a bare URL with no picture — which, for a visual brand, is the
      difference between a message that looks like a shop and one that looks like spam.

      `og:image` must be an **absolute** URL. A preview fetcher has no page context to
      resolve a relative one against, so Vite's base-path rewriting cannot help and the
      origin is hardcoded. A PR preview therefore advertises the production image; that
      is harmless, and better than a preview link showing nothing.

      JPEG, not WebP: WhatsApp's fetcher does not reliably render WebP, and a card that
      silently fails to draw is worse than a slightly larger file. `public/og.jpg` is
      generated from real brand photography by `scripts/convertImages.mjs`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumora Flames" />
    <meta property="og:title" content="Lumora Flames — Handcrafted Artisanal Candles" />
    <meta
      property="og:description"
      content="Small-batch candles poured by hand. Message us to commission yours."
    />
    <meta property="og:url" content="https://lumora-flames-official.github.io/home/" />
    <meta property="og:image" content="https://lumora-flames-official.github.io/home/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A hand-poured Lumora Flames candle, lit." />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="/home/assets/index-DaKkS2h4.js"></script>
    <link rel="stylesheet" crossorigin href="/home/assets/index-CxCXkbkl.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
